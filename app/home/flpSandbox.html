<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Analytics Suite</title>

    <!-- Fiori Launchpad sandbox: the single "home" for the whole project.
         One tile group per task, each tile opening its own Fiori Elements app:
           Task 1  Sales Analytics   -> salesanalytics (ALP)
           Task 2  Classification    -> salesclassification / salesclassproducts / salesclassstores (ALPs)
           Task 3  Association        -> salesassociation (multi-view List Report)
           Task 4  AI Assistant       -> retailassistant (Object Page dashboard + bot + PDF)
         The apps stay pure Fiori Elements; the launchpad is standard SAP Fiori
         navigation (not freestyle UI5). Sandbox is for development/demo only;
         on Cloud Foundry the managed approuter serves the equivalent site. -->
    <script type="text/javascript">
        window["sap-ushell-config"] = {
            defaultRenderer: "fiori2",
            renderers: {
                fiori2: {
                    componentData: {
                        config: {
                            search: "hidden",
                            enableSearch: false,
                            rootIntent: "Shell-home"
                        }
                    }
                }
            },
            services: {
                "LaunchPage": {
                    adapter: {
                        config: {
                            groups: [
                                {
                                    id: "groupSales",
                                    title: "Sales Analytics",
                                    isPreset: true, isVisible: true, isGroupLocked: false,
                                    tiles: [
                                        {
                                            id: "tileSales",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                title: "Sales Analytics",
                                                subtitle: "Revenue, profit & quantity by geography and time",
                                                icon: "sap-icon://bar-chart",
                                                targetURL: "#Sales-display"
                                            }
                                        }
                                    ]
                                },
                                {
                                    id: "groupClassification",
                                    title: "Classification",
                                    isPreset: true, isVisible: true, isGroupLocked: false,
                                    tiles: [
                                        {
                                            id: "tileCustomers",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                title: "Customer Segmentation",
                                                subtitle: "RFM: VIP / Regular / At Risk",
                                                icon: "sap-icon://customer",
                                                targetURL: "#Customer-display"
                                            }
                                        },
                                        {
                                            id: "tileProducts",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                title: "Product Performance",
                                                subtitle: "Margin vs volume quadrants",
                                                icon: "sap-icon://product",
                                                targetURL: "#Product-display"
                                            }
                                        },
                                        {
                                            id: "tileStores",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                title: "Store Efficiency",
                                                subtitle: "Revenue per m² tiers",
                                                icon: "sap-icon://building",
                                                targetURL: "#Store-display"
                                            }
                                        }
                                    ]
                                },
                                {
                                    id: "groupAssociation",
                                    title: "Association",
                                    isPreset: true, isVisible: true, isGroupLocked: false,
                                    tiles: [
                                        {
                                            id: "tileAssociation",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                title: "Association Analytics",
                                                subtitle: "Demographics, price elasticity & store-size correlation",
                                                icon: "sap-icon://chain-link",
                                                targetURL: "#Association-display"
                                            }
                                        }
                                    ]
                                },
                                {
                                    id: "groupAssistant",
                                    title: "AI Assistant",
                                    isPreset: true, isVisible: true, isGroupLocked: false,
                                    tiles: [
                                        {
                                            id: "tileAssistant",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                title: "Retail Assistant",
                                                subtitle: "KPI dashboard, explanation bot & executive report",
                                                icon: "sap-icon://learning-assistant",
                                                targetURL: "#Assistant-display"
                                            }
                                        }
                                    ]
                                }
                            ]
                        }
                    }
                }
            },
            applications: {
                "Sales-display": {
                    title: "Sales Analytics",
                    description: "Analytical List Page over SalesFacts",
                    additionalInformation: "SAPUI5.Component=retail.analytics.salesanalytics",
                    applicationType: "URL",
                    url: "/retail.analytics.salesanalytics/"
                },
                "Customer-display": {
                    title: "Customer Segmentation",
                    description: "RFM customer segments",
                    additionalInformation: "SAPUI5.Component=retail.analytics.salesclassification",
                    applicationType: "URL",
                    url: "/retail.analytics.salesclassification/"
                },
                "Product-display": {
                    title: "Product Performance",
                    description: "Product performance quadrants",
                    additionalInformation: "SAPUI5.Component=retail.analytics.salesclassproducts",
                    applicationType: "URL",
                    url: "/retail.analytics.salesclassproducts/"
                },
                "Store-display": {
                    title: "Store Efficiency",
                    description: "Store efficiency tiers",
                    additionalInformation: "SAPUI5.Component=retail.analytics.salesclassstores",
                    applicationType: "URL",
                    url: "/retail.analytics.salesclassstores/"
                },
                "Association-display": {
                    title: "Association Analytics",
                    description: "Demographic affinity, price elasticity, store-size correlation",
                    additionalInformation: "SAPUI5.Component=retail.analytics.salesassociation",
                    applicationType: "URL",
                    url: "/retail.analytics.salesassociation/"
                },
                "Assistant-display": {
                    title: "Retail Assistant",
                    description: "AI KPI dashboard, explanation bot and executive report",
                    additionalInformation: "SAPUI5.Component=retail.analytics.retailassistant",
                    applicationType: "URL",
                    url: "/retail.analytics.retailassistant/"
                }
            }
        };
    </script>

    <script src="https://ui5.sap.com/1.120.0/test-resources/sap/ushell/bootstrap/sandbox.js" id="sap-ushell-bootstrap"></script>
    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.120.0/resources/sap-ui-core.js"
        data-sap-ui-libs="sap.m, sap.ushell, sap.collaboration, sap.ui.layout"
        data-sap-ui-async="true"
        data-sap-ui-preload="async"
        data-sap-ui-theme="sap_fiori_3"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-language="en"
        data-sap-ui-resourceroots='{
            "retail.analytics.salesanalytics": "/retail.analytics.salesanalytics/",
            "retail.analytics.salesclassification": "/retail.analytics.salesclassification/",
            "retail.analytics.salesclassproducts": "/retail.analytics.salesclassproducts/",
            "retail.analytics.salesclassstores": "/retail.analytics.salesclassstores/",
            "retail.analytics.salesassociation": "/retail.analytics.salesassociation/",
            "retail.analytics.retailassistant": "/retail.analytics.retailassistant/"
        }'
        data-sap-ui-frameOptions="allow"
        data-sap-ui-flexibilityServices='[{"connector": "LocalStorageConnector"}]'>
    </script>
    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ushell.Container.createRenderer().placeAt("content");
        });
    </script>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
